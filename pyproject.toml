[project]
name = "open-cpap-parser"
version = "0.1.0"
description = "Multi-manufacturer CPAP data parsing library and CLI tool"
authors = [{ name = "Camden Bock" }]
license = "GPL-3.0-only"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cpap-py>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
respironics = ["pyedflib"]

[project.scripts]
cpap-parser = "open_cpap_parser.cli:main"

[build-system]
requires = ["maturin>=1.0"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "open_cpap_parser._rust_parsers"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
