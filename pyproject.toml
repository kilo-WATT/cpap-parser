[project]
name = "cpap-parser"
version = "0.1.0"
description = "Multi-manufacturer CPAP data parsing library and CLI tool"
authors = [{ name = "Camden Bock", email = "camdenbock@gmail.com" }]
license = "GPL-3.0-only"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["cpap", "sleep-apnea", "medical", "resmed", "respironics", "data-parsing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://gitlab.com/open-cpap/cpap-parser"
Repository = "https://gitlab.com/open-cpap/cpap-parser"
Issues = "https://gitlab.com/open-cpap/cpap-parser/-/issues"

[project.optional-dependencies]
# ResMed parsing uses the compiled cpap-py backend. It is optional so the base
# package stays pure-Python and pip-installable everywhere; the adapter degrades
# gracefully (HAS_CPAP_PY=False) when it is absent.
resmed = ["cpap-py>=1.0.0"]
respironics = ["pyedflib"]
docs = [
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.25",
]
validate = [
    "rich>=13",
]

[project.scripts]
cpap-parser = "cpap_parser.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Pure-Python distribution. The optional Rust accelerator (cpap_parser._rust_parsers)
# is not built here; adapters that use it degrade gracefully when it is absent.
[tool.hatch.build.targets.wheel]
packages = ["cpap_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "validation: cross-check parser output against OSCAR reference data (requires --run-validation)",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
