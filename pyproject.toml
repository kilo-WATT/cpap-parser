[project]
name = "cpap-parser"
version = "0.1.0"
description = "Multi-manufacturer CPAP data parsing library and CLI tool"
authors = [{ name = "Camden Bock", email = "camdenbock@gmail.com" }]
license = "GPL-3.0-only"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["cpap", "sleep-apnea", "medical", "resmed", "respironics", "data-parsing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "cpap-py>=1.0.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://gitlab.com/open-cpap/cpap-parser"
Repository = "https://gitlab.com/open-cpap/cpap-parser"
Issues = "https://gitlab.com/open-cpap/cpap-parser/-/issues"

[project.optional-dependencies]
respironics = ["pyedflib"]
docs = [
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.25",
]
validate = [
    "rich>=13",
]

[project.scripts]
cpap-parser = "cpap_parser.cli:main"

[build-system]
requires = ["maturin>=1.0"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "cpap_parser._rust_parsers"
exclude = ["cpap_parser/validation/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "validation: cross-check parser output against OSCAR reference data (requires --run-validation)",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
