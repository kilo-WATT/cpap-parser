include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - project: 'renovate-bot/renovate-runner'
    file: '/templates/renovate-config-validator.gitlab-ci.yml'

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == 'schedule'
    - if: $CI_PIPELINE_SOURCE == 'push'

stages:
  - build
  - test
  - secret-detection
  - publish
  - deploy

# Shared setup fragments referenced by before_script blocks.
# Installs Rust (stable) + uv, then sources both env files so
# cargo and uv are on PATH for the rest of the job.
.rust_uv_setup: &rust_uv_setup
  - apt-get update -qq && apt-get install -y -qq curl gcc build-essential
  - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
  - . "$HOME/.cargo/env"
  - curl -LsSf https://astral.sh/uv/install.sh | sh
  - source "$HOME/.local/bin/env"

.uv_only_setup: &uv_only_setup
  - apt-get update -qq && apt-get install -y -qq curl
  - curl -LsSf https://astral.sh/uv/install.sh | sh
  - source "$HOME/.local/bin/env"

# ── Matrix build: verify package compiles on multiple Python versions ──

build:
  stage: build
  parallel:
    matrix:
      - IMAGE: python:3.11-slim
      - IMAGE: python:3.12-slim
      - IMAGE: python:3.13-slim
  image: ${IMAGE}
  before_script:
    - *rust_uv_setup
    - uv sync
  script:
    - uvx maturin build --release --generate-stubs --out dist/
  artifacts:
    paths:
      - dist/
    expire_in: 30 days

# ── Security & linting ──

sast:
  stage: test

secret_detection:
  stage: secret-detection

# ── Tests ──

test:
  stage: test
  image: python:3.12-slim
  before_script:
    - *rust_uv_setup
    - uv sync
  script:
    - uv run pytest tests/ -v

# ── Renovate config validation ──

renovate-config-validator:
  stage: test
  before_script:
    - echo "Using renovate image's bundled renovate-config-validator"
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'push'

# ── Publish to GitLab PyPI Registry ──

publish:
  stage: publish
  image: python:3.12-slim
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - job: build
      artifacts: true
  before_script:
    - *uv_only_setup
  script:
    - >-
      uv publish
      --publish-url "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi"
      --username gitlab-ci-token
      --password "${CI_JOB_TOKEN}"
      dist/*.whl dist/*.tar.gz

# ── Deploy MkDocs + Rust API docs to GitLab Pages ──

pages:
  stage: deploy
  image: python:3.12-slim
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - *rust_uv_setup
    - uv sync --extra docs
    - uvx maturin develop --release
  script:
    - uv run mkdocs build --site-dir public
    - cargo doc --no-deps
    - mv target/doc public/rust
  artifacts:
    paths:
      - public
    expire_in: 30 days
