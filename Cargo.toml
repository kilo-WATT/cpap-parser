[package]
name = "cpap-parser"
version = "0.1.0"
edition = "2021"
description = "Multi-manufacturer CPAP data parsing — Rust extension module"
license = "GPL-3.0-or-later"
license-file = "LICENSE.md"
documentation = "https://gitlab.com/open-cpap/cpap-parser"
repository = "https://gitlab.com/open-cpap/cpap-parser"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "experimental-inspect"] }
binrw = "0.14"
chrono = "0.4"
zip = "2"
quick-xml = "0.36"
